; Surcharges de php.ini-production
expose_php = Off
display_errors = Off
display_startup_errors = Off
log_errors = On
error_log = /dev/stderr
; les variables d'environnement Docker (DB_HOST...) doivent être visibles par getenv()
variables_order = "EGPCS"
session.cookie_httponly = 1
memory_limit = 128M
post_max_size = 2M
upload_max_filesize = 2M
