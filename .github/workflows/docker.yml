name: CI/CD Docker

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  WEB_IMAGE: projet-docker-web
  DB_IMAGE: projet-docker-db
  # Trivy est lancé depuis son image officielle, épinglée par version
  TRIVY_IMAGE: aquasec/trivy:0.76.1

jobs:
  # ------------------------------------------------------------------
  # 1. Vérification syntaxique du code PHP
  # ------------------------------------------------------------------
  lint:
    name: Lint PHP
    runs-on: ubuntu-latest
    container: php:8.2-cli
    steps:
      - uses: actions/checkout@v5

      - name: php -l sur tous les fichiers
        run: find src -name '*.php' -print0 | xargs -0 -n1 php -l

  # ------------------------------------------------------------------
  # 2. Construction des images, test de la stack et scan de sécurité
  # ------------------------------------------------------------------
  build-test:
    name: Build, tests et scan
    runs-on: ubuntu-latest
    needs: lint
    env:
      DOCKERHUB_USER: ci
      TAG: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v5

      - name: Étape de test du Dockerfile web (php -l dans l'image)
        run: docker build --target test -f web/Dockerfile .

      - name: Préparation de .env et des secrets
        run: ./scripts/init-secrets.sh

      - name: Validation du fichier Compose
        run: docker compose config --quiet

      - name: Construction des images
        run: docker compose build

      - name: Démarrage de la stack (attente des healthchecks)
        run: docker compose up -d --wait --wait-timeout 180

      - name: Tests fonctionnels
        run: |
          set -eux
          # page d'accueil et healthcheck
          curl -fsS http://localhost:8080/ | grep -q "Liste d'articles"
          curl -fsS http://localhost:8080/healthz.php | grep -q OK
          # ajout d'un article puis relecture
          code=$(curl -s -o /dev/null -w '%{http_code}' \
            -d 'title=Article CI&author=GitHub Actions&content=Test automatique' \
            http://localhost:8080/validation.php)
          test "$code" = "302"
          curl -fsS http://localhost:8080/ | grep -q "Article CI"
          # formulaire incomplet refusé
          code=$(curl -s -o /dev/null -w '%{http_code}' -d 'title=x' http://localhost:8080/validation.php)
          test "$code" = "400"
          # communication inter-conteneurs par nom de service
          docker exec web ping -c 1 db
          # sécurité : utilisateur non-root et système de fichiers en lecture seule
          test "$(docker exec web id -u)" = "33"
          ! docker exec web touch /var/www/html/test

      - name: Test de persistance (down puis up)
        run: |
          set -eux
          docker compose down
          docker compose up -d --wait --wait-timeout 180
          curl -fsS http://localhost:8080/ | grep -q "Article CI"

      - name: Logs en cas d'échec
        if: failure()
        run: docker compose logs

      - name: Scan Trivy (échec si vulnérabilité CRITIQUE corrigeable)
        run: |
          for img in "ci/${WEB_IMAGE}:${TAG}" "ci/${DB_IMAGE}:${TAG}"; do
            docker run --rm \
              -v /var/run/docker.sock:/var/run/docker.sock \
              "$TRIVY_IMAGE" image --scanners vuln \
              --severity CRITICAL --ignore-unfixed \
              --exit-code 1 "$img"
          done

      - name: Arrêt de la stack
        if: always()
        run: docker compose down -v

  # ------------------------------------------------------------------
  # 3. Publication sur Docker Hub (uniquement sur push vers main)
  # ------------------------------------------------------------------
  publish:
    name: Publication Docker Hub
    runs-on: ubuntu-latest
    needs: build-test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    strategy:
      # une image en échec n'annule pas la publication de l'autre
      fail-fast: false
      matrix:
        include:
          - image: projet-docker-web
            context: .
            dockerfile: web/Dockerfile
          - image: projet-docker-db
            context: ./db
            dockerfile: db/Dockerfile
    steps:
      - uses: actions/checkout@v5

      # Nom d'utilisateur nettoyé (espaces, retours à la ligne, majuscules)
      # pour éviter un nom d'image invalide si le secret a été mal collé.
      - name: Vérification du compte Docker Hub
        id: hub
        env:
          HUB_USER: ${{ vars.DOCKERHUB_USERNAME || secrets.DOCKERHUB_USERNAME }}
          HUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          user=$(printf '%s' "$HUB_USER" | tr -d '[:space:]' | tr '[:upper:]' '[:lower:]')
          if [ -z "$user" ] || [ -z "$HUB_TOKEN" ]; then
            echo "::error::DOCKERHUB_USERNAME ou DOCKERHUB_TOKEN manquant (Settings > Secrets and variables > Actions)"
            exit 1
          fi
          echo "user=$user" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - name: Connexion à Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ steps.hub.outputs.user }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Tags (latest + SHA du commit)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.hub.outputs.user }}/${{ matrix.image }}
          tags: |
            type=raw,value=latest
            type=sha,format=long,prefix=

      - name: Build et push
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
